services:
  crochet:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_PATH: /data/crochet.sqlite
    volumes:
      - crochet-data:/data
volumes:
  crochet-data:
